# configs/experiment.yaml
experiment_name: "conv_autoencoder_mvtec_multicategory"
# Available categories: bottle, cable, capsule, carpet, grid, hazelnut,
# leather, metal_nut, pill, screw, tile, toothbrush, transistor, wood, zipper.
category:
  - "bottle"
  - "grid"
  - "hazelnut"
seed: 42

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  # Weight for MSE in the combined MSE + SSIM reconstruction loss.
  # The remaining weight (1 - loss_alpha) is applied to SSIM loss.
  loss_alpha: 0.85
  device: "auto"
  validation_split: 0.2

models:
  - name: "autoencoder"
    enabled: true
    # Select the checkpoint with the lowest normal-validation reconstruction loss.
    selection: "best"
    # Saved under experiment_artifacts/{experiment_name}/
    weights_path: "autoencoder_weights.pth"

quantization_targets:
  - format: "fp32"          # Baseline full precision ONNX
    enabled: true
  - format: "fp16"          # Half precision ONNX conversion
    enabled: true
  - format: "int8_dynamic"   # Post-training dynamic INT8 quantization via ONNX Runtime
    enabled: true

benchmarking:
  devices:
    - "cpu"
    # Requires an ONNX Runtime GPU installation and a CUDA-enabled environment.
    - "cuda"

evaluation:
  benchmark_iterations: 100
  device: "auto"
  anomaly_threshold_percentile: 95.0
  metrics:
    - "latency_ms_p50"
    - "latency_ms_p99"
    - "model_size_mb"
    - "image_accuracy"
    - "image_precision"
    - "image_recall"
    - "image_f1"
    - "image_auroc"